<div style="width: 1200px; height: 760px; box-sizing: border-box; background-color: #0A0908; background-image: radial-gradient(circle, rgba(212,180,131,0.06) 1px, rgba(0,0,0,0) 1px); background-size: 28px 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-family: 'Plus Jakarta Sans', sans-serif; color: #F5EFE4;">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":760}}'>
class Component extends DCLogic {
  componentDidMount() { this._mounted = true; this._start(); }
  componentWillUnmount() { this._mounted = false; clearTimeout(this._wait); if (this._raf) cancelAnimationFrame(this._raf); if (this._r) { this._r.dispose(); this._r = null; } this._running = false; }
  _start() {
    if (this._running || !this._canvas || !this._mounted) return;
    var T = window.THREE;
    if (!T) { clearTimeout(this._wait); var self = this; this._wait = setTimeout(function () { self._start(); }, 150); return; }
    this._running = true;
    try { this._build(T); } catch (e) { console.error(e); }
  }
  _env(T, r) {
    var pmrem = new T.PMREMGenerator(r);
    var s = new T.Scene();
    s.add(new T.Mesh(new T.BoxGeometry(10, 10, 10), new T.MeshBasicMaterial({ color: 0x0E0D0C, side: T.BackSide })));
    var panel = function (w, h, hex, k, x, y, z, rx, ry) {
      var m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color: new T.Color(hex).multiplyScalar(k), side: T.DoubleSide }));
      m.position.set(x, y, z); m.rotation.set(rx, ry, 0); s.add(m);
    };
    panel(8, 3, 0xFFFFFF, 3.2, 0, 4.9, 0, Math.PI / 2, 0);
    panel(1, 6, 0xFFFFFF, 5, -4.9, 0.5, 0.5, 0, Math.PI / 2);
    panel(0.6, 6, 0xFFE9C4, 3, 4.9, 0.5, -1, 0, Math.PI / 2);
    panel(8, 0.7, 0xFFFFFF, 2, 0, 0.6, 4.9, 0, 0);
    panel(5, 0.8, 0xD4B483, 3, 0, -0.8, -4.9, 0, 0);
    panel(10, 10, 0x2A2420, 1, 0, -4.9, 0, Math.PI / 2, 0);
    var tex = pmrem.fromScene(s, 0.03).texture;
    pmrem.dispose();
    return tex;
  }
  _build(T) {
    var c = this._canvas, W = c.width, H = c.height;
    var r = new T.WebGLRenderer({ canvas: c, antialias: true, alpha: true, preserveDrawingBuffer: true });
    r.setPixelRatio(1); r.setSize(W, H, false);
    r.outputEncoding = T.sRGBEncoding; r.toneMapping = T.ACESFilmicToneMapping; r.toneMappingExposure = 1.15; r.physicallyCorrectLights = true;
    this._r = r;
    var scene = new T.Scene(); scene.environment = this._env(T, r);
    var cam = new T.PerspectiveCamera(30, W / H, 0.1, 50); cam.position.set(0, 0.5, 7); cam.lookAt(0, 0, 0);
    var g = new T.Group(); scene.add(g);
    var chrome = new T.MeshStandardMaterial({ color: 0xF2F2F4, metalness: 1, roughness: 0.08 });
    var goldMetal = new T.MeshStandardMaterial({ color: 0xD4B483, metalness: 1, roughness: 0.14 });
    var glow = new T.MeshStandardMaterial({ color: 0xFFE3B0, emissive: 0xFFC978, emissiveIntensity: 2.6, roughness: 0.4 });
    var glass = new T.MeshPhysicalMaterial({ color: 0xFFFFFF, metalness: 0, roughness: 0.02, transmission: 1, thickness: 1.3, ior: 1.5, clearcoat: 1, clearcoatRoughness: 0.03, attenuationColor: new T.Color(0xF3E2C2), attenuationDistance: 2.5, iridescence: 0.6, iridescenceIOR: 1.3, envMapIntensity: 1.5 });
    var ring = function (rad, tube, mat) { var m = new T.Mesh(new T.TorusGeometry(rad, tube, 48, 240), mat); g.add(m); return m; };
    var r1 = ring(1.6, 0.055, chrome), r2 = ring(1.34, 0.075, goldMetal), r3 = ring(1.1, 0.045, chrome);
    var sat = function (rg, rad, ang, size) { var s = new T.Mesh(new T.SphereGeometry(size, 24, 18), glow); s.position.set(Math.cos(ang) * rad, Math.sin(ang) * rad, 0); rg.add(s); };
    sat(r1, 1.6, 0.6, 0.085); sat(r2, 1.34, 2.5, 0.07); sat(r3, 1.1, 4.2, 0.06);
    g.add(new T.Mesh(new T.SphereGeometry(0.72, 96, 64), glass));
    var core = new T.Mesh(new T.IcosahedronGeometry(0.25, 5), glow); g.add(core);
    g.add(new T.PointLight(0xFFC978, 12, 6, 2));
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var self = this, t0 = performance.now();
    var pose = function (t) {
      r1.rotation.set(1.3, 0.25, t * 0.45);
      r2.rotation.set(0.5, -0.95, -t * 0.62);
      r3.rotation.set(-0.4, 1.15, t * 0.85);
      g.rotation.y = t * 0.1;
      core.scale.setScalar(1 + 0.06 * Math.sin(t * 2.4));
    };
    var tick = function (now) {
      if (!self._r) return;
      pose((now - t0) / 1000 + 1.2);
      r.render(scene, cam);
      self._raf = requestAnimationFrame(tick);
    };
    if (reduce) { pose(1.2); r.render(scene, cam); } else this._raf = requestAnimationFrame(tick);
  }
  renderVals() {
    if (!this._setCanvas) { var self = this; this._setCanvas = function (el) { self._canvas = el; if (el) self._start(); }; }
    return { setCanvas: this._setCanvas };
  }
}
</script>
